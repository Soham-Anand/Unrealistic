<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌌</text></svg>">
<title>Unrealistic v1</title>
<style>
  :root { --bg: #212121; --panel: #171717; --bubble-u: #2f2f2f; --text: #ececec; --muted: #b4b4b4; --accent: #19c37d; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, sans-serif; display: flex; height: 100vh; }
  #side { width: 260px; background: var(--panel); padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  #side button.new { background: transparent; color: var(--text); border: 1px solid #4d4d4d; border-radius: 8px; padding: 10px; cursor: pointer; text-align: left; }
  #side .about { font-size: .82em; color: var(--muted); line-height: 1.5; }
  #side .about b { color: var(--text); }
  #main { flex: 1; display: flex; flex-direction: column; max-width: 820px; margin: 0 auto; width: 100%; }
  #status { text-align: center; font-size: .8em; color: var(--muted); padding: 8px; }
  #status .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #888; margin-right: 6px; }
  #status.on .dot { background: var(--accent); }
  #chat { flex: 1; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 14px; white-space: pre-wrap; word-break: break-word; line-height: 1.5; }
  .user { align-self: flex-end; background: var(--bubble-u); }
  .bot { align-self: flex-start; background: transparent; padding-left: 0; }
  .bot.typing::after { content: "▍"; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  #chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 16px 8px; }
  #chips button { background: transparent; color: var(--text); border: 1px solid #4d4d4d; border-radius: 16px; padding: 7px 12px; cursor: pointer; font-size: .85em; }
  #chips button:hover { background: #2f2f2f; }
  #bar { display: flex; gap: 8px; padding: 8px 16px 16px; }
  #in { flex: 1; background: #2f2f2f; color: var(--text); border: none; border-radius: 16px; padding: 12px 16px; font-size: 1em; resize: none; }
  #send { background: #fff; color: #000; border: none; border-radius: 50%; width: 40px; height: 40px; cursor: pointer; font-size: 1.1em; align-self: flex-end; }
  #send:disabled { opacity: .4; cursor: wait; }
  @media (max-width: 640px) { #side { display: none; } }
</style>
</head>
<body>
<div id="side">
  <button class="new" onclick="newChat()">+ New chat</button>
  <div class="about">
    <b>Unrealistic v1</b> — 190M params, trained from zero on a MacBook Air.<br><br>
    ~356K steps · GK 16/16 · Math 10/15<br><br>
    Runs free on ZeroGPU. No login, nothing shared between visitors.<br><br>
    Honest limits: biology, Euro-history, big-number word problems may fail. English only.
  </div>
</div>
<div id="main">
  <div id="status"><span class="dot"></span><span id="stext">connecting…</span></div>
  <div id="chat"></div>
  <div id="chips"></div>
  <div id="bar">
    <textarea id="in" rows="1" placeholder="Message Unrealistic…"></textarea>
    <button id="sendBtn" onclick="sendMsg()">↑</button>
  </div>
</div>
<script>
const SPACE = "https://sohamprogrammer-unrealistic-v1-demo.hf.space";
const STARTERS = ["What can you do?", "What is 8 + 7?", "What is the capital of France?",
  "Who was the lead singer of Linkin Park?", "Who built the Taj Mahal?",
  "What is the national animal of India?", "Write a Python function to add two numbers:",
  "Why do we have seasons?"];
let history = [], busy = false, online = false;
const $ = id => document.getElementById(id);
async function api(path, body) {
  const r = await fetch(SPACE + path, {
    method: 'POST',
    credentials: 'omit',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  if (!r.ok) throw new Error('http ' + r.status);
  return r.json();
}

function setStatus(on, text) {
  document.querySelector('#status').className = on ? 'on' : '';
  $('stext').textContent = text;
}
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function addMsg(role, text) {
  const d = document.createElement('div');
  d.className = 'msg ' + role;
  d.innerHTML = esc(text).replace(/\n/g, '<br>');
  $('chat').appendChild(d);
  $('chat').scrollTop = $('chat').scrollHeight;
  return d;
}
function showChips() {
  const box = $('chips'); box.innerHTML = '';
  STARTERS.forEach(s => {
    const b = document.createElement('button');
    b.textContent = s;
    b.onclick = () => { $('in').value = s; sendMsg(); };
    box.appendChild(b);
  });
}
async function connect() {
  setStatus(false, 'waking up the model (first load ~1 min)…');
  try {
    const r = await fetch(SPACE + '/config', { credentials: 'omit' });
    if (!r.ok) throw new Error('config');
    online = true;
    setStatus(true, 'online — free ZeroGPU backend');
    if (history.length === 0) {
      addMsg('bot', "Hey! I'm Unrealistic v1, a tiny AI trained from scratch on a laptop. Try a starter below!");
      showChips();
    }
  } catch (e) {
    setStatus(false, 'Space asleep or busy — retrying in 10s…');
    setTimeout(connect, 10000);
  }
}
async function sendMsg() {
  const text = $('in').value.trim();
  if (!text || busy || !online) return;
  busy = true; $('sendBtn').disabled = true;
  $('chips').innerHTML = '';
  $('in').value = '';
  addMsg('user', text);
  const bubble = addMsg('bot', '');
  bubble.classList.add('typing');
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  let lastErr = null, stage = 'init';
  for (let attempt = 1; attempt <= 3; attempt++) {
  try {
    let prompt = '';
    for (let i = 0; i < history.length; i += 2)
      prompt += 'User: ' + history[i] + '\nAssistant: ' + (history[i+1] || '') + '\n';
    prompt += 'User: ' + text + '\nAssistant:';
    // Gradio v4 queue protocol: POST queue/join (fn 11 = /chat, data pair
    // [prompt, null]) -> SSE queue/data. The null 2nd element is required.
    const session = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())) + '-' + attempt;
    stage = 'join';
    console.log('[uv1] attempt', attempt, 'prompt_len', prompt.length);
    await api('/queue/join', { data: [prompt, null], fn_index: 11, session_hash: session });
    console.log('[uv1] join ok');
    bubble.innerHTML = esc(attempt > 1 ? 'Retrying… (attempt ' + attempt + ')' : 'Thinking…');
    stage = 'stream-open';
    const es = await fetch(SPACE + '/queue/data?session_hash=' + session, { credentials: 'omit' });
    console.log('[uv1] stream status', es.status, 'body?', !!es.body);
    if (!es.ok) throw new Error('stream ' + es.status);
    stage = 'stream-read';
    const reader = es.body.getReader();
    let nread = 0;
    const dec = new TextDecoder();
    let buf = '', best = '';
    const use = t => {
      if (typeof t !== 'string') return;
      if (!t || t === 'null' || t === 'undefined') return;
      if (t.length > best.length) {
        best = t;
        bubble.innerHTML = esc(best).replace(/\n/g, '<br>');
        $('chat').scrollTop = $('chat').scrollHeight;
      }
    };
    const handle = (parts) => {
      for (const part of parts) {
        const m = part.match(/^data: ([\s\S]*)$/m);
        if (!m) continue;
        try {
          const o = JSON.parse(m[1]);
          if (o.msg === 'estimation' && typeof o.rank === 'number' && o.rank > 0)
            bubble.innerHTML = esc('Queued… position ' + o.rank + ' (free GPU is busy, seconds away)');
          const d = o && o.output && o.output.data;
          if (Array.isArray(d)) {
            const first = d.find(x => typeof x === 'string' && x && x !== 'null');
            if (first !== undefined) use(first);
          } else if (typeof d === 'string') use(d);
          if (o.msg === 'process_completed') { console.log('[uv1] completed frame:', JSON.stringify(o).slice(0, 300)); return 'done'; }
        } catch (e) { console.log('[uv1] parse-fail:', JSON.stringify(String(m[1]).slice(0, 120))); }
      }
    };
    let finished = false;
    let loggedRaw = false;
    for (;;) {
      const { done, value } = await reader.read();
      nread++;
      if (!done) buf += dec.decode(value, { stream: true });
      if (!loggedRaw && buf.length > 0) { loggedRaw = true; console.log('[uv1] raw head:', JSON.stringify(buf.slice(0, 300))); }
      const parts = buf.split('\n\n');
      buf = done ? '' : parts.pop();
      if (handle(parts) === 'done') { console.log('[uv1] process_completed seen'); finished = true; break; }
      if (done) { console.log('[uv1] stream ended, best_len=', best.length); break; }
    }
    try { await reader.cancel(); } catch (e) {}
    bubble.classList.remove('typing');
    if (!best) throw new Error('empty');
    history.push(text, best);
    break;
  } catch (e) {
    lastErr = e;
    console.error('[uv1] failed at stage', stage, e);
    bubble.classList.remove('typing');
    if (attempt < 3) { await sleep(4000); continue; }
    const raw = String((lastErr && (lastErr.message || lastErr.name)) || lastErr || 'unknown');
    const detail = (raw || 'empty-error') + ' @' + stage;
    bubble.innerHTML = esc('Hmm — backend hiccup (cold start or queue). Wait a few seconds and try again. [' + detail.slice(0, 140) + ']');
    setStatus(false, 'last error: ' + detail.slice(0, 140));
  }
  } // retry loop
  busy = false; $('sendBtn').disabled = false;
}
function newChat() { history = []; $('chat').innerHTML = ''; $('in').value = ''; showChips(); }
$('in').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); }
});
showChips();
connect();
</script>
</body>
</html>
